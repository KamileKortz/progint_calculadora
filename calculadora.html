<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Bebas+Neue&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="calc">
    <div class="calc-header">CALCULADORA // v1.0</div>

    <div class="display">
      <div class="expr" id="expr"></div>
      <div class="value" id="value">0</div>
    </div>

    <div class="grid">
      <button class="clear" onclick="clearAll()">AC</button>
      <button class="op" onclick="inputOp('^')">x^y</button>
      <button class="op" onclick="inputLog()">log</button>
      <button class="op" onclick="inputOp('/')">÷</button>

      <div class="sep"></div>

      <button onclick="inputNum('7')">7</button>
      <button onclick="inputNum('8')">8</button>
      <button onclick="inputNum('9')">9</button>
      <button class="op" onclick="inputOp('*')">×</button>

      <button onclick="inputNum('4')">4</button>
      <button onclick="inputNum('5')">5</button>
      <button onclick="inputNum('6')">6</button>
      <button class="op" onclick="inputOp('-')">−</button>

      <button onclick="inputNum('1')">1</button>
      <button onclick="inputNum('2')">2</button>
      <button onclick="inputNum('3')">3</button>
      <button class="op" onclick="inputOp('+')">+</button>

      <button onclick="inputNum('0')" class="span2">0</button>
      <button onclick="inputDot()">.</button>
      <button class="eq" onclick="calculate()">=</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
